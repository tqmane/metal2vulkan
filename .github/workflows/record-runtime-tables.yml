name: Record runtime fixture tables
on:
  push:
    branches: [steelbrain/runtime-fixture-recording]
permissions:
  contents: read
jobs:
  compatible-math:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate existing math ABI with its original compiler generation
        run: |
          set -euo pipefail
          brew install llvm@21
          export PATH="/opt/homebrew/opt/llvm@21/bin:$PATH"
          if ! xcrun --sdk macosx --find metal-as; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          bash scripts/regen-air-fixtures/regen-air-fixtures.sh kernel_frexp_ilogb
          mkdir compatible-math
          cp crates/metal2vulkan-validation/fixtures/public/engine/kernel_frexp_ilogb.{ll,air.ll} compatible-math/
          cp crates/metal2vulkan-validation/fixtures/public/engine/TOOLCHAIN compatible-math/
      - uses: actions/upload-artifact@v4
        with:
          name: compatible-math
          path: compatible-math/
          retention-days: 7
  record:
    needs: compatible-math
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the recording baseline before building
        run: git cat-file -e '2a848ea6abb7d63ebebb8f34177d2efd3cc54805^{commit}'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Require native assemblers and validators
        run: |
          set -euo pipefail
          brew install llvm@21 llvm spirv-tools
          echo /opt/homebrew/opt/llvm@21/bin >> "$GITHUB_PATH"
          if ! xcrun --sdk macosx --find metal-as; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal-as
          /opt/homebrew/opt/llvm@21/bin/llvm-as --version
          spirv-val --version
      - name: Validate marker-free generation and regenerate selected fixtures
        run: |
          set -euo pipefail
          printf '#include <metal_stdlib>\nusing namespace metal;\nkernel void marker_probe(device uint *p [[buffer(0)]]) { *p = 1; }\n' | xcrun --sdk macosx metal -x metal -std=metal4.0 -Xclang -disable-lifetime-markers -S -emit-llvm -o "$RUNNER_TEMP/marker-probe.ll" -
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/regen-air-fixtures
          fixtures=()
          for source in crates/metal2vulkan-validation/fixtures/public/engine/*.metal; do
            if grep -q '^// metal-lifetime-markers: off$' "$source"; then
              fixtures+=("$(basename "$source" .metal)")
            fi
          done
          test "${#fixtures[@]}" = 14
          bash scripts/regen-air-fixtures/regen-air-fixtures.sh "${fixtures[@]}"
      - uses: actions/download-artifact@v4
        with:
          name: compatible-math
          path: compatible-math
      - name: Retain the existing math ABI and its actual compiler provenance
        run: |
          python3 - <<'PY'
          import pathlib
          engine = pathlib.Path('crates/metal2vulkan-validation/fixtures/public/engine')
          source = pathlib.Path('compatible-math')
          for name in ('kernel_frexp_ilogb.ll', 'kernel_frexp_ilogb.air.ll'):
              (engine/name).write_bytes((source/name).read_bytes())
          def record(text):
              prefix = 'fixture kernel_frexp_ilogb: '
              fields = dict(line.split(': ', 1) for line in text.splitlines() if line.startswith(('metal: ', 'macosx-sdk: ')))
              return next((line for line in text.splitlines() if line.startswith(prefix)), prefix+'metal: '+fields['metal']+'; macosx-sdk: '+fields['macosx-sdk'])
          path = engine/'TOOLCHAIN'
          lines = [line for line in path.read_text().splitlines() if not line.startswith('fixture kernel_frexp_ilogb: ')]
          lines.append(record((source/'TOOLCHAIN').read_text()))
          head = [line for line in lines if not line.startswith('fixture ')]
          tail = sorted(line for line in lines if line.startswith('fixture '))
          path.write_text('\n'.join(head+tail)+'\n')
          PY
          rm -r compatible-math
      - name: Record through existing decoders and compilation checks
        run: |
          set -euo pipefail
          cargo test --release -p metal2vulkan --all-features --lib -- \
            tests::air_canon::typed_and_opaque_fixtures_specialize_identically \
            tests::air_input::bless_engine_goldens \
            tests::golden_hashes::bless_golden_hashes \
            tests::public_fixtures_engine::record_engine_inventory \
            --include-ignored --nocapture --test-threads=1
          test_bin=$(find target/release/deps -maxdepth 1 -type f -name 'metal2vulkan-*' -perm -111)
          test "$(printf '%s\n' "$test_bin" | wc -l | tr -d ' ')" = 1
          METAL2VULKAN_TEST_REQUIRE_PINNED_LLVM=1 "$test_bin" tests::air_input::engine_fixtures_match_their_golden_printout --exact --nocapture
          METAL2VULKAN_TEST_REQUIRE_PINNED_LLVM=1 METAL2VULKAN_LLVM_AS=/opt/homebrew/opt/llvm/bin/llvm-as "$test_bin" tests::air_input::engine_fixtures_match_their_golden_printout --exact --nocapture
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          base = '2a848ea6abb7d63ebebb8f34177d2efd3cc54805'
          root = pathlib.Path('.')
          engine = 'crates/metal2vulkan-validation/fixtures/public/engine/'
          goldens = 'crates/metal2vulkan/tests/air_input/'
          marked = [p.stem for p in pathlib.Path(engine).glob('*.metal')
                    if '// metal-lifetime-markers: off' in p.read_text()]
          assert len(marked) == 14
          allowed = {
              engine+'TOOLCHAIN', engine+'native_sample_positions.ll',
              engine+'native_sample_positions.air.ll', goldens+'native_sample_positions.txt',
              'crates/metal2vulkan/tests/golden_hashes.tsv',
              'crates/metal2vulkan/tests/public_fixture_expectations_engine.tsv',
              'scripts/regen-air-fixtures/regen-air-fixtures.sh',
              'scripts/regen-air-fixtures/test_regen_air_fixtures.py',
              'scripts/regen-air-fixtures/README.md',
          }
          for stem in marked:
              allowed.update(engine+stem+ext for ext in ('.metal', '.ll', '.air.ll'))
              allowed.add(goldens+stem+'.txt')
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          excluded = {'.github/workflows/record-runtime-tables.yml',
                      'crates/metal2vulkan/src/tests/public_fixtures_engine.rs'}
          excluded.update(engine+stem+'.air' for stem in marked)
          changed -= excluded
          assert changed <= allowed, sorted(changed - allowed)
          out = root/'recorded'
          files = {}
          for name in sorted(changed):
              target = out/name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root/name, target)
              files[name] = hashlib.sha256(target.read_bytes()).hexdigest()
          (out/'manifest.json').write_text(json.dumps({'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'base':base, 'files':files},indent=2)+'\n')
          print('Generated final files:', sorted(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-fixture-tables
          retention-days: 7
          path: recorded/
